# SonarQube Cloud (brief 13.5, 15.7; ADR 0014). Analysed in CI only (ci.yml job `sonar`);
# automatic analysis is off in the project settings.
sonar.organization=marcominervinidev
sonar.projectKey=marcominervinidev_live-factcheck
sonar.projectName=live-factcheck

# Production code of every workspace; tests are analysed as tests, not as code.
sonar.sources=apps/web/src,services,packages,evals/src,scripts,deploy,tools
sonar.tests=apps/web/src,apps/web/tests,services,packages,evals/src,scripts,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.int.test.ts,apps/web/tests/**,tests/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.int.test.ts,**/node_modules/**,**/dist/**,**/reports/**,**/.stryker-tmp/**

# Same exclusions as the vitest coverage configs: test helpers, and wiring files that are
# covered by child-process tests (v8 coverage does not follow child processes).
sonar.coverage.exclusions=**/src/testing/**,**/src/index.ts,**/src/main.ts,**/src/main.tsx,packages/service-kit/src/lifecycle.ts,packages/service-kit/src/bin/**,evals/src/run.ts,scripts/*.sh,scripts/ci/**,scripts/*/src/run.ts,deploy/**,tools/**

# LCOV reports come from the CI test jobs; the job passes their paths
# (sonar.javascript.lcov.reportPaths) after downloading the artifacts.
sonar.sourceEncoding=UTF-8
