# SonarQube Cloud (brief 13.5, 15.7; ADR 0014). Analysed in CI only (ci.yml job `sonar`);
# automatic analysis is off in the project settings.
sonar.organization=marcominervinidev
sonar.projectKey=marcominervinidev_live-factcheck
sonar.projectName=live-factcheck

# Production code of every workspace; tests are analysed as tests, not as code.
sonar.sources=apps/web/src,services,packages,evals/src,scripts,deploy,tools
sonar.tests=apps/web/src,apps/web/tests,services,packages,evals/src,scripts,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.int.test.ts,apps/web/tests/**,tests/**,services/stt-local/tests/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.int.test.ts,services/stt-local/tests/**,**/node_modules/**,**/dist/**,**/reports/**,**/.stryker-tmp/**

# Same exclusions as the vitest coverage configs: test helpers, and wiring files that are
# covered by child-process tests (v8 coverage does not follow child processes). scripts/*.py
# is the host-only dev tool plus its stdlib test: the CI static job runs the test, but no
# coverage harness exists for host python (owner decision 2026-09-30, option A).
sonar.coverage.exclusions=scripts/*.py,**/src/testing/**,**/src/index.ts,**/src/main.ts,**/src/main.tsx,services/stt-local/src/stt_local/main.py,packages/service-kit/src/lifecycle.ts,packages/service-kit/src/bin/**,evals/src/run.ts,scripts/*.sh,scripts/ci/**,scripts/*/src/run.ts,deploy/**,tools/**,evals/src/run-detection.ts,apps/web/src/audio/microphone.ts,apps/web/src/audio/capture-worklet.ts

# LCOV reports (and coverage.xml of stt-local) come from the CI test jobs; the job passes their
# paths (sonar.javascript.lcov.reportPaths, sonar.python.coverage.reportPaths) after downloading
# the artifacts.
sonar.sourceEncoding=UTF-8
