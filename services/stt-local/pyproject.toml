[project]
name = "stt-local"
version = "0.0.0"
description = "Local speech-to-text with faster-whisper and VAD chunks (brief 10, ADR 0016)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  # uvicorn serves WebSockets only with one of these libraries installed.
  "websockets==17.1",
  "faster-whisper==1.2.1",
  "numpy==2.5.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "mypy==2.3.1",
  "ruff==0.16.9",
  "pytest-cov==7.1.0",
]

[project.scripts]
stt-local = "stt_local.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_local"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PL", "N"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
