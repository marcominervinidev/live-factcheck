packages:
  - apps/*
  - services/*
  - packages/*
  - tests/*
  - evals

# Dependency install scripts are denied unless explicitly allowed here.
allowBuilds:
  # Git hooks are installed via `make hooks-install` (shim into the toolbox), not by postinstall.
  lefthook: false
  # esbuild (via tsx) ships its binary as an optional dependency; the postinstall only verifies it.
  esbuild: false
  # Optional native speed-ups and a version check pulled in by testcontainers (dockerode);
  # all have pure-JS fallbacks.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Pulled in by promptfoo (tests/redteam) for features we do not use: a bundled Chromium,
  # swc's binary check (the binary comes as an optional platform package), ONNX runtime downloads.
  '@playwright/browser-chromium': false
  '@swc/core': false
  onnxruntime-node: false
