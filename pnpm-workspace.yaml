packages:
  - apps/*
  - services/*
  - packages/*
  - tests/*
  # Own pnpm project with its own lockfile: promptfoo's ~600 packages must not change how the
  # services' dependencies resolve (they would get openai's optional AWS peers in their images).
  - '!tests/redteam'
  - evals
  - scripts/llm-scan

# Dependency install scripts are denied unless explicitly allowed here.
allowBuilds:
  # Git hooks are installed via `make hooks-install` (shim into the toolbox), not by postinstall.
  lefthook: false
  # esbuild (via tsx) ships its binary as an optional dependency; the postinstall only verifies it.
  esbuild: false
  # Optional native speed-ups and a version check pulled in by testcontainers (dockerode);
  # all have pure-JS fallbacks.
  cpu-features: false
  ssh2: false
  protobufjs: false
