# Test overlay (brief 13.2 stages 3 and 4): runs the Playwright suites as containers inside the
# stack networks. Caddy gets its LAN name (LAN_HOST, default lfc.local) as alias, so TLS works via SNI.
#   make test-api   make test-e2e

x-playwright: &playwright
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  profiles: [test]
  ipc: host
  volumes:
    - .:/workspace
  environment:
    CI: ${CI:-false}
    # Caddy only serves localhost and LAN_HOST, so the tests use the same name (SNI).
    BASE_URL: https://${LAN_HOST:-lfc.local}:8443
    # Extra CLI arguments, e.g. '--shard=1/2 --project=webkit-iphone' in CI.
    PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
    # The tests authenticate like a user of the app (ADR 0011); the token stays a file.
    GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
  secrets: [gateway_token]

services:
  gateway:
    environment:
      # Parallel test workers share one limit; the limit itself is covered by the gateway's
      # integration test.
      RATE_LIMIT_CHECKS_PER_MINUTE: '600'

  caddy:
    networks:
      edge:
        aliases: ['${LAN_HOST:-lfc.local}']

  api-tests:
    <<: *playwright
    working_dir: /workspace/tests/api
    # Stage 3 talks to every service directly (internal) and to the edge through Caddy.
    networks: [edge, internal]
    command: ['sh', '-c', 'node_modules/.bin/playwright test $${PLAYWRIGHT_ARGS}']

  e2e-tests:
    <<: *playwright
    working_dir: /workspace/tests/e2e
    # Stage 4 sees only what a browser sees: the edge.
    networks: [edge]
    command: ['sh', '-c', 'node_modules/.bin/playwright test $${PLAYWRIGHT_ARGS}']
