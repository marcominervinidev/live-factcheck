# Test overlay (brief 13.2 stages 3 and 4): runs the Playwright suites as containers inside the
# stack networks. Caddy gets its LAN name (LAN_HOST, default lfc.local) as alias, so TLS works via SNI.
#   make test-api   make test-e2e

x-playwright: &playwright
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  profiles: [test]
  ipc: host
  volumes:
    - .:/workspace
  environment:
    CI: ${CI:-false}
    # Caddy only serves localhost and LAN_HOST, so the tests use the same name (SNI).
    BASE_URL: https://${LAN_HOST:-lfc.local}:8443
    # Extra CLI arguments, e.g. '--shard=1/2 --project=webkit-iphone' in CI.
    PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
    # The tests authenticate like a user of the app (ADR 0011); the token stays a file.
    GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
  secrets: [gateway_token]

services:
  gateway:
    environment:
      # Parallel test workers share one limit; the limit itself is covered by the gateway's
      # integration test.
      RATE_LIMIT_CHECKS_PER_MINUTE: '600'

  caddy:
    networks:
      edge:
        aliases: ['${LAN_HOST:-lfc.local}']

  api-tests:
    <<: *playwright
    working_dir: /workspace/tests/api
    # Stage 3 talks to every service directly (internal) and to the edge through Caddy.
    networks: [edge, internal]
    # TLS is verified against Caddy's local root CA (tls internal).
    volumes:
      - .:/workspace
      # Only the public root certificate: the CA's private keys never leave the caddy container
      # (the owner's devices trust this CA; security review, phase 1).
      - type: volume
        source: caddy-data
        target: /caddy-ca/root.crt
        read_only: true
        volume:
          subpath: caddy/pki/authorities/local/root.crt
    environment:
      CI: ${CI:-false}
      BASE_URL: https://${LAN_HOST:-lfc.local}:8443
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      NODE_EXTRA_CA_CERTS: /caddy-ca/root.crt
    command: ['sh', '-c', 'node_modules/.bin/playwright test $${PLAYWRIGHT_ARGS}']

  e2e-tests:
    <<: *playwright
    working_dir: /workspace/tests/e2e
    # Stage 4 sees only what a browser sees: the edge.
    networks: [edge]
    command: ['sh', '-c', 'node_modules/.bin/playwright test $${PLAYWRIGHT_ARGS}']

  # Phase 1b (brief 15.7, ADR 0014): OWASP ZAP baseline scan (passive DAST) against the app
  # through Caddy, like a browser sees it. Reports go to tests/security/reports/ (must be
  # writable for uid 1000). Accepted findings and their reasons: tests/security/zap-rules.tsv.
  zap:
    image: zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: [test]
    networks: [edge]
    volumes:
      - ./tests/security:/zap/wrk
    command:
      - zap-baseline.py
      # AJAX spider: the app is a SPA, the plain spider only sees the HTML shell.
      - -j
      - -t
      - https://${LAN_HOST:-lfc.local}:8443
      - -c
      - zap-rules.tsv
      - -r
      - reports/zap-report.html
      - -J
      - reports/zap-report.json
      - -I
      - -s

  # Phase 1b (brief 15.7, ADR 0014): LLM red teaming with promptfoo against the running stack,
  # like a client. Run the stack with a real model (see tests/redteam/README.md); `make redteam`.
  redteam:
    <<: *playwright
    profiles: [redteam]
    working_dir: /workspace/tests/redteam
    networks: [edge]
    volumes:
      - .:/workspace
      # Only the public root certificate of Caddy's local CA, never its keys.
      - type: volume
        source: caddy-data
        target: /caddy-ca/root.crt
        read_only: true
        volume:
          subpath: caddy/pki/authorities/local/root.crt
    environment:
      NODE_EXTRA_CA_CERTS: /caddy-ca/root.crt
      REDTEAM_BASE_URL: https://${LAN_HOST:-lfc.local}:8443
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      # promptfoo must not talk to its own cloud: no telemetry, update checks, sharing or
      # hosted generation. Results stay in the container (config dir in /tmp).
      PROMPTFOO_DISABLE_TELEMETRY: 'true'
      PROMPTFOO_DISABLE_UPDATE: 'true'
      PROMPTFOO_DISABLE_SHARING: 'true'
      PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
      PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: 'true'
      PROMPTFOO_CONFIG_DIR: /tmp/promptfoo
    command:
      - node_modules/.bin/promptfoo
      - eval
      - --config
      - promptfooconfig.yaml
      - --no-cache
      - --no-progress-bar
      - --output
      - reports/redteam-results.json
      - --output
      - reports/redteam-results.html

  # Stage 5 (brief 13.5): `make eval` runs the claim set against this stack like a client.
  # The providers under test are whatever the stack is configured with; reports go to
  # docs/evidence/phase-1/evals/.
  eval:
    <<: *playwright
    profiles: [eval]
    working_dir: /workspace/evals
    networks: [edge]
    # TLS is verified against Caddy's local root CA (tls internal).
    volumes:
      - .:/workspace
      # Only the public root certificate: the CA's private keys never leave the caddy container
      # (the owner's devices trust this CA; security review, phase 1).
      - type: volume
        source: caddy-data
        target: /caddy-ca/root.crt
        read_only: true
        volume:
          subpath: caddy/pki/authorities/local/root.crt
    environment:
      NODE_EXTRA_CA_CERTS: /caddy-ca/root.crt
      EVAL_BASE_URL: https://${LAN_HOST:-lfc.local}:8443
      EVAL_LABEL: ${EVAL_LABEL:-unnamed}
      EVAL_INCLUDE_UNREVIEWED: ${EVAL_INCLUDE_UNREVIEWED:-false}
      EVAL_LIMIT: ${EVAL_LIMIT:-0}
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
    command: ['node_modules/.bin/tsx', '--conditions=development', 'src/run.ts']
