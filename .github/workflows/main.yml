# After the merge to main (brief 13.3, 14.2): build every image for linux/amd64 and linux/arm64,
# push it to GHCR tagged with the commit SHA, then run stages 3 and 4 against exactly those
# pushed images (the ones that will be deployed, factor V). From phase 5 this job also updates
# the image tag in the GitOps overlay; from phase 6 images are signed with SBOM + provenance.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  images-matrix:
    name: images to build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: node scripts/ci/images.mjs

  publish:
    name: publish · ${{ matrix.image.name }}
    needs: images-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 is emulated with QEMU on the amd64 runner; the layer cache keeps rebuilds fast.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  stack-tests:
    name: stack tests (pushed images)
    needs: publish
    uses: ./.github/workflows/stack-tests.yml
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      registry: ghcr.io/${{ github.repository }}
      tag: ${{ github.sha }}
      e2e-args: --project=chromium-desktop --project=chromium-mobile --project=webkit-iphone

  main-passed:
    name: main passed
    needs: [images-matrix, publish, stack-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | node -e "
            const needs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const bad = Object.entries(needs).filter(([, v]) => !['success', 'skipped'].includes(v.result));
            if (bad.length) { console.error('failed:', bad.map(([k, v]) => k + '=' + v.result).join(', ')); process.exit(1); }
            console.log('all stages green');"
