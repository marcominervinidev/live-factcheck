# PR pipeline (brief 13.3, 14.2): only stages that ci.yml does not run.
# TP4: contract check, Dockerfile lint, Semgrep, image build (amd64) + Trivy per image.
# CodeQL runs in codeql.yml. API/E2E tests follow in TP6. See ADR 0005.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract-check:
    name: contract check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-contract-change.sh "origin/$BASE_REF"

  hadolint:
    name: dockerfile lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint every Dockerfile
        run: |
          status=0
          for file in $(git ls-files '**/Dockerfile' 'Dockerfile'); do
            echo "== $file"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint - < "$file" || status=1
          done
          exit $status

  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejsscan --config p/dockerfile
          --config p/github-actions --config p/secrets

  images-matrix:
    name: images to build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        # Every workspace with a Dockerfile is an image; the build context is the repo root.
        run: |
          images=$(git ls-files 'services/*/Dockerfile' 'apps/*/Dockerfile' \
            | jq -R -s -c 'split("\n") | map(select(length > 0) | {name: (split("/")[1]), dockerfile: .})')
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"

  image:
    name: image · ${{ matrix.image.name }}
    needs: images-matrix
    if: needs.images-matrix.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # PRs build amd64 only for speed; multi-arch is built on main (brief 13.4).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: runtime
          platforms: linux/amd64
          tags: lfc/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
      - name: trivy (critical vulnerabilities and secrets fail the build)
        # --ignore-unfixed: a critical CVE without an available fix cannot be resolved by us;
        # it is reported by the nightly full scan instead of blocking every PR.
        env:
          IMAGE: lfc/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1
          --no-progress "$IMAGE"

  # Single required check for branch protection (see ci.yml `ci passed`).
  pr-passed:
    name: pr passed
    needs: [contract-check, hadolint, semgrep, images-matrix, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | node -e "
            const needs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const bad = Object.entries(needs).filter(([, v]) => !['success', 'skipped'].includes(v.result));
            if (bad.length) { console.error('failed:', bad.map(([k, v]) => k + '=' + v.result).join(', ')); process.exit(1); }
            console.log('all stages green');"
