# Push pipeline (brief 13.3, 14.2): stage 0 plus unit and integration tests,
# backend and frontend in parallel, only for affected workspaces.
# PR-only stages (images, scans, API/E2E) live in pr.yml; see ADR 0005.
name: ci

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  static:
    name: static (stage 0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise
      - name: MCP configs in sync (Claude Code / Antigravity)
        run: node scripts/ci/check-mcp-parity.mjs
      - name: gitleaks (full history)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

  changes:
    name: affected workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_unit: ${{ steps.affected.outputs.backend_unit }}
      backend_int: ${{ steps.affected.outputs.backend_int }}
      frontend_unit: ${{ steps.affected.outputs.frontend_unit }}
      frontend_int: ${{ steps.affected.outputs.frontend_int }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: affected
        # On main everything runs; on branches only what changed since main, plus dependents.
        env:
          BASE: ${{ github.ref != 'refs/heads/main' && 'origin/main' || '' }}
        run: node scripts/ci/affected.mjs ${BASE:+"$BASE"}

  backend-unit:
    name: backend unit · ${{ matrix.workspace.name }}
    needs: changes
    if: needs.changes.outputs.backend_unit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.backend_unit) }}
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "${WORKSPACE}..."
        env:
          WORKSPACE: ${{ matrix.workspace.name }}
      - name: test
        working-directory: ${{ matrix.workspace.dir }}
        # Coverage with the 80 % thresholds runs once per workspace (see scripts/ci/affected.mjs).
        run: |
          coverage=()
          if [ "$COVERAGE" = true ]; then
            coverage=(--coverage.enabled --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=lcov)
          fi
          pnpm run "$TEST_SCRIPT" \
            --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml "${coverage[@]}"
        env:
          TEST_SCRIPT: ${{ matrix.workspace.script }}
          COVERAGE: ${{ matrix.workspace.coverage }}
      - name: report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ matrix.workspace.dir }}/reports/junit.xml
          check_name: ${{ github.job }} · ${{ matrix.workspace.name }}
      - name: coverage summary
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.workspace.dir }}
        run: |
          if [ -f reports/coverage/coverage-summary.json ]; then
            node -e "const t=require('./reports/coverage/coverage-summary.json').total;console.log(['lines','branches','functions','statements'].map(k=>k+': '+t[k].pct+'%').join(' · '))" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: prepare coverage for SonarQube
        id: lcov
        if: ${{ !cancelled() && matrix.workspace.coverage }}
        working-directory: ${{ matrix.workspace.dir }}
        env:
          DIR: ${{ matrix.workspace.dir }}
        run: |
          if [ -f reports/coverage/lcov.info ]; then
            # SonarQube analyses from the repo root; vitest writes paths relative to the workspace.
            sed -i "s#^SF:#SF:${DIR}/#" reports/coverage/lcov.info
            echo "name=coverage-${DIR//\//-}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.lcov.outputs.name != '' }}
        with:
          name: ${{ steps.lcov.outputs.name }}
          path: ${{ matrix.workspace.dir }}/reports/coverage/lcov.info
          retention-days: 3

  backend-int:
    name: backend integration · ${{ matrix.workspace.name }}
    needs: changes
    if: needs.changes.outputs.backend_int != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.backend_int) }}
    steps: *test-steps

  frontend-unit:
    name: frontend unit · ${{ matrix.workspace.name }}
    needs: changes
    if: needs.changes.outputs.frontend_unit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.frontend_unit) }}
    steps: *test-steps

  frontend-int:
    name: frontend integration · ${{ matrix.workspace.name }}
    needs: changes
    if: needs.changes.outputs.frontend_int != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    # Stage 2b: Playwright against the built app with a mocked backend; the official image ships
    # the browsers (Chromium, WebKit) and their system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.frontend_int) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "${WORKSPACE}..."
        env:
          WORKSPACE: ${{ matrix.workspace.name }}
      - name: test
        working-directory: ${{ matrix.workspace.dir }}
        run: pnpm run test:int
        env:
          # Playwright runs as root inside the container image.
          HOME: /root
      - name: report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: ${{ matrix.workspace.dir }}/reports/junit.xml
          check_name: ${{ github.job }} · ${{ matrix.workspace.name }}
      - name: playwright report (videos and traces, linked in the PR comment)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-stage-2b
          path: |
            ${{ matrix.workspace.dir }}/playwright-report
            ${{ matrix.workspace.dir }}/test-results
          retention-days: 7

  # SonarQube Cloud (brief 15.7, ADR 0014): code smells, duplication, security hotspots and the
  # coverage trend on new code. Advisory during the baseline week, hence not part of `ci passed`.
  sonar:
    name: sonarqube
    needs: [changes, backend-unit, backend-int, frontend-unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube needs it for blame and to detect new code.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: analysis parameters
        id: params
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          args=()
          lcov=$(find coverage-reports -name lcov.info 2>/dev/null | sort | paste -sd, -)
          if [ -n "$lcov" ]; then args+=("-Dsonar.javascript.lcov.reportPaths=$lcov"); fi
          # A push to a branch with an open PR is analysed as that PR, so SonarQube comments on it.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0] // empty | "\(.number) \(.base.ref)"' || true)
          if [ -n "$pr" ]; then
            read -r number base <<< "$pr"
            args+=("-Dsonar.pullrequest.key=$number" "-Dsonar.pullrequest.branch=$BRANCH" "-Dsonar.pullrequest.base=$base")
          elif [ "$BRANCH" != main ]; then
            args+=("-Dsonar.branch.name=$BRANCH")
          fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.params.outputs.args }}

  # Single required check for branch protection: green only if every stage above
  # succeeded or was skipped because nothing relevant changed.
  ci-passed:
    name: ci passed
    needs: [static, changes, backend-unit, backend-int, frontend-unit, frontend-int]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | node -e "
            const needs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const bad = Object.entries(needs).filter(([, v]) => !['success', 'skipped'].includes(v.result));
            if (bad.length) { console.error('failed:', bad.map(([k, v]) => k + '=' + v.result).join(', ')); process.exit(1); }
            console.log('all stages green');"
