# Reusable: stages 3 (API) and 4 (E2E) against the Compose stack with mock providers
# (brief 13.2–13.4). Called by pr.yml (images built from the PR), main.yml (the pushed GHCR
# images) and nightly.yml (full browser matrix + Lighthouse).
name: stack-tests

on:
  workflow_call:
    inputs:
      registry:
        description: 'Image registry prefix; "lfc" builds the images locally.'
        type: string
        default: lfc
      tag:
        description: Image tag (only used when pulling from a registry).
        type: string
        default: local
      shards:
        description: JSON array of E2E shard numbers, e.g. "[1, 2]".
        type: string
        default: '[1]'
      e2e-args:
        description: Extra Playwright arguments, e.g. a project selection.
        type: string
        default: ''
      lighthouse:
        description: Also run Lighthouse CI against the stack (stage 5).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    name: shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      COMPOSE_FILE: docker-compose.yml:compose.test.yaml
      CI: 'true'
      LFC_REGISTRY: ${{ inputs.registry }}
      LFC_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Playwright containers use the test workspaces' node_modules from the checkout.
      - run: pnpm install --frozen-lockfile --filter @lfc/api-tests --filter @lfc/e2e-tests --filter @lfc/web
      - name: throwaway secrets
        run: |
          echo "SECRETS_DIR=$RUNNER_TEMP/secrets" >> "$GITHUB_ENV"
          scripts/secrets-init.sh "$RUNNER_TEMP/secrets" > /dev/null
          # Throwaway values. On Linux, containers with other uids cannot read 0600 bind-mounted
          # secret files (Docker Desktop maps ownership; see ADR 0004).
          chmod 644 "$RUNNER_TEMP"/secrets/*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR (pushed images)
        if: ${{ inputs.registry != 'lfc' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: start the stack from locally built images
        if: ${{ inputs.registry == 'lfc' }}
        run: docker compose up -d --build --wait
      - name: start the stack from pushed images (no build)
        if: ${{ inputs.registry != 'lfc' }}
        run: |
          docker compose pull --quiet
          docker compose up -d --no-build --wait
      - name: stage 3 – API tests
        if: ${{ matrix.shard == 1 }}
        run: docker compose run --rm api-tests
      - name: stage 4 – E2E tests
        env:
          PLAYWRIGHT_ARGS: --shard=${{ matrix.shard }}/${{ strategy.job-total }} ${{ inputs.e2e-args }}
        run: docker compose run --rm e2e-tests
      - name: stage 5 – Lighthouse CI
        if: ${{ inputs.lighthouse && matrix.shard == 1 }}
        run: >-
          docker run --rm --ipc=host --network live-factcheck_edge -v "$PWD":/workspace
          -w /workspace/apps/web mcr.microsoft.com/playwright:v1.63.0-noble
          sh -c 'export CHROME_PATH=$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome | head -1);
          node_modules/.bin/lhci autorun --config=lighthouserc.json'
      - name: test reports
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: tests/*/reports/junit.xml
          check_name: stack tests (${{ github.workflow }}) shard ${{ matrix.shard }}
      - name: upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/e2e/blob-report
          retention-days: 7
      - name: upload Lighthouse report
        if: ${{ !cancelled() && inputs.lighthouse && matrix.shard == 1 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: apps/web/reports/lighthouse
          retention-days: 14
      - name: stack logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color > stack.log
      - name: upload stack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-${{ matrix.shard }}
          path: stack.log
          retention-days: 7
      - name: stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  report:
    name: e2e report
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @lfc/e2e-tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: merge shard reports into one HTML report
        working-directory: tests/e2e
        run: node_modules/.bin/playwright merge-reports --reporter html ../../all-blob-reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-e2e
          path: tests/e2e/playwright-report
          retention-days: 14
