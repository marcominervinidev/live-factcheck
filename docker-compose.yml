# Local stack (brief 12, 15). Topology and hardening: docs/adr/0004-compose-network-topology.md
#   make up      build and start everything, wait until healthy
#   make ready   check /readyz of every service
# Only caddy publishes host ports. Secrets come from SECRETS_DIR outside the repo.
# Images: lfc/<service>:local by default; CI sets LFC_REGISTRY/LFC_TAG to test pushed images.
name: live-factcheck

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  restart: unless-stopped
  tmpfs:
    - /tmp:size=16m,mode=1777

x-node-service: &node-service
  <<: *hardening
  healthcheck:
    test: ['CMD', '/nodejs/bin/node', 'node_modules/@lfc/service-kit/dist/bin/healthcheck.js']
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  deploy:
    resources:
      limits: { cpus: '0.50', memory: 256M }

x-redis-env: &redis-env
  REDIS_URL: redis://redis:6379
  REDIS_USERNAME: app
  REDIS_PASSWORD_FILE: /run/secrets/redis_password

services:
  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: deploy/compose/caddy/Dockerfile
    image: ${LFC_REGISTRY:-lfc}/caddy:${LFC_TAG:-local}
    # Host ports are configurable because macOS may already run Apache on 80 (LFC_HTTP_PORT).
    # The HTTP port only redirects; keep HTTPS on 443 so redirects and iPhone URLs need no port.
    ports:
      - '${LFC_HTTP_PORT:-80}:8080'
      - '${LFC_HTTPS_PORT:-443}:8443'
    environment:
      LAN_HOST: ${LAN_HOST:-lfc.local}
      WEB_UPSTREAM: web:8080
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, frontend]
    depends_on:
      web: { condition: service_healthy }
      gateway: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 128M }

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/web:${LFC_TAG:-local}
    environment:
      WEB_GATEWAY_URL: /api
    networks: [frontend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 64M }

  gateway:
    <<: *node-service
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/gateway:${LFC_TAG:-local}
    environment:
      <<: *redis-env
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      PRIVACY_MODE: ${PRIVACY_MODE:-cloud}
      RATE_LIMIT_CHECKS_PER_MINUTE: ${RATE_LIMIT_CHECKS_PER_MINUTE:-20}
      # Audio path (ADR 0015): one internal WebSocket per recording, network internal only.
      TRANSCRIPTION_URL: ws://transcription:8080/v1/audio
      MAX_RECORDING_MS: ${MAX_RECORDING_MS:-}
    secrets: [redis_password, gateway_token]
    networks: [frontend, internal]
    depends_on:
      redis: { condition: service_healthy }
      transcription: { condition: service_healthy }

  transcription:
    <<: *node-service
    build:
      context: .
      dockerfile: services/transcription/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/transcription:${LFC_TAG:-local}
    environment:
      <<: *redis-env
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_MODE: ${PRIVACY_MODE:-cloud}
      # Speech-to-text (brief 10, ADR 0016); the provider is exchangeable by configuration.
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      STT_MODEL: ${STT_MODEL:-mock}
      STT_LANGUAGE: ${STT_LANGUAGE:-de}
      STT_REGION: ${STT_REGION:-eu}
      LOCAL_STT_URL: ${LOCAL_STT_URL:-}
      STT_ENDPOINTING_MS: ${STT_ENDPOINTING_MS:-}
      STT_FINALIZE_SILENCE_MS: ${STT_FINALIZE_SILENCE_MS:-}
      DEEPGRAM_API_KEY_FILE: /run/secrets/deepgram_api_key
      ASSEMBLYAI_API_KEY_FILE: /run/secrets/assemblyai_api_key
      CLOUD_DAILY_BUDGET_USD: ${CLOUD_DAILY_BUDGET_USD:-2}
    # Only the STT keys (brief 15.1); egress for the cloud STT providers.
    secrets: [redis_password, deepgram_api_key, assemblyai_api_key]
    networks: [internal, egress]
    depends_on:
      redis: { condition: service_healthy }

  claim-extractor:
    <<: *node-service
    build:
      context: .
      dockerfile: services/claim-extractor/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/claim-extractor:${LFC_TAG:-local}
    environment:
      <<: *redis-env
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_MODE: ${PRIVACY_MODE:-cloud}
      EXTRACTOR_LLM_PROVIDER: ${EXTRACTOR_LLM_PROVIDER:-mock}
      EXTRACTOR_LLM_MODEL: ${EXTRACTOR_LLM_MODEL:-mock}
      EXTRACTOR_LLM_BASE_URL: ${EXTRACTOR_LLM_BASE_URL:-}
      EXTRACTOR_LLM_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Claim detection (ADR 0017); the llm classifier uses EXTRACTOR_LLM_*.
      DETECTOR_CLASSIFIER_PROVIDER: ${DETECTOR_CLASSIFIER_PROVIDER:-mock}
      DETECTOR_CLASSIFIER_MODEL: ${DETECTOR_CLASSIFIER_MODEL:-}
      DETECTOR_CONFIDENCE_HIGH: ${DETECTOR_CONFIDENCE_HIGH:-0.75}
      DETECTOR_CONFIDENCE_LOW: ${DETECTOR_CONFIDENCE_LOW:-0.5}
      DETECTOR_MIN_SCORE: ${DETECTOR_MIN_SCORE:-}
      DETECTOR_WINDOW_SEGMENTS: ${DETECTOR_WINDOW_SEGMENTS:-}
      TYPESAFE_API_KEY_FILE: /run/secrets/typesafe_api_key
      CLOUD_DAILY_BUDGET_USD: ${CLOUD_DAILY_BUDGET_USD:-2}
    secrets: [redis_password, anthropic_api_key, typesafe_api_key]
    # egress for a cloud LLM or Jev (like fact-checker and explainer).
    networks: [internal, egress]
    depends_on:
      redis: { condition: service_healthy }

  fact-checker:
    <<: *node-service
    # SIGTERM lets the message in progress finish (a check runs up to 60 s) before Docker sends SIGKILL.
    stop_grace_period: 70s
    build:
      context: .
      dockerfile: services/fact-checker/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/fact-checker:${LFC_TAG:-local}
    environment:
      <<: *redis-env
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_MODE: ${PRIVACY_MODE:-cloud}
      CHECKER_LLM_PROVIDER: ${CHECKER_LLM_PROVIDER:-mock}
      CHECKER_LLM_MODEL: ${CHECKER_LLM_MODEL:-mock}
      CHECKER_LLM_BASE_URL: ${CHECKER_LLM_BASE_URL:-}
      # Per model call and per whole check; raise both for slow local models (empty = default).
      CHECKER_LLM_TIMEOUT_MS: ${CHECKER_LLM_TIMEOUT_MS:-}
      CHECKER_TIMEOUT_MS: ${CHECKER_TIMEOUT_MS:-}
      CHECKER_LLM_API_KEY_FILE: /run/secrets/anthropic_api_key
      CHECKER_CLASSIFIER_PROVIDER: ${CHECKER_CLASSIFIER_PROVIDER:-mock}
      CHECKER_CLASSIFIER_MODEL: ${CHECKER_CLASSIFIER_MODEL:-}
      CHECKER_CONFIDENCE_HIGH: ${CHECKER_CONFIDENCE_HIGH:-0.75}
      CHECKER_CONFIDENCE_LOW: ${CHECKER_CONFIDENCE_LOW:-0.45}
      TYPESAFE_API_KEY_FILE: /run/secrets/typesafe_api_key
      # live: the three source tiers on the internet; mock: a fixed local corpus (tests, CI).
      CHECKER_RESEARCH_SOURCES: ${CHECKER_RESEARCH_SOURCES:-mock}
      # Red team only (tests/redteam): adds a crafted injection page to the mock corpus.
      CHECKER_MOCK_INJECTED_PAGE: ${CHECKER_MOCK_INJECTED_PAGE:-off}
      GOOGLE_FACTCHECK_API_KEY_FILE: /run/secrets/google_factcheck_api_key
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: http://searxng:8080
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-mock}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-mock}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      SOURCE_TIERS_FILE: /app/config/source-tiers.yaml
      CHECKER_USER_AGENT_URL: https://github.com/marcominervinidev/live-factcheck
      CLOUD_DAILY_BUDGET_USD: ${CLOUD_DAILY_BUDGET_USD:-2}
    # Least privilege (brief 15.1): LLM, classifier and fact-check API keys; nothing else.
    secrets: [redis_password, anthropic_api_key, typesafe_api_key, google_factcheck_api_key]
    # egress: page fetches, fact-check/Wikipedia APIs, cloud LLMs, LM Studio/Ollama on the host.
    # The SSRF guard keeps fetched URLs away from internal targets (ADR 0004 amendment).
    networks: [internal, egress]
    depends_on:
      redis: { condition: service_healthy }

  explainer:
    <<: *node-service
    # SIGTERM lets the message in progress finish (an explanation runs up to 45 s) before Docker sends SIGKILL.
    stop_grace_period: 55s
    build:
      context: .
      dockerfile: services/explainer/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/explainer:${LFC_TAG:-local}
    environment:
      <<: *redis-env
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_MODE: ${PRIVACY_MODE:-cloud}
      EXPLAINER_LLM_PROVIDER: ${EXPLAINER_LLM_PROVIDER:-mock}
      EXPLAINER_LLM_MODEL: ${EXPLAINER_LLM_MODEL:-mock}
      EXPLAINER_LLM_BASE_URL: ${EXPLAINER_LLM_BASE_URL:-}
      EXPLAINER_LLM_TIMEOUT_MS: ${EXPLAINER_LLM_TIMEOUT_MS:-}
      EXPLAINER_TIMEOUT_MS: ${EXPLAINER_TIMEOUT_MS:-}
      EXPLAINER_LLM_API_KEY_FILE: /run/secrets/anthropic_api_key
      CLOUD_DAILY_BUDGET_USD: ${CLOUD_DAILY_BUDGET_USD:-2}
    # Only the LLM key, never the classifier or search keys (brief 15.1, ADR 0009).
    secrets: [redis_password, anthropic_api_key]
    networks: [internal, egress]
    depends_on:
      redis: { condition: service_healthy }

  # Local speech-to-text (brief 10, ADR 0016): only with `--profile local-stt` (`make up-local`).
  stt-local:
    <<: *hardening
    profiles: [local-stt]
    build:
      context: .
      dockerfile: services/stt-local/Dockerfile
      target: runtime
    image: ${LFC_REGISTRY:-lfc}/stt-local:${LFC_TAG:-local}
    environment:
      PORT: '8000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOCAL_STT_MODEL: ${LOCAL_STT_MODEL:-small}
      LOCAL_STT_COMPUTE_TYPE: ${LOCAL_STT_COMPUTE_TYPE:-int8}
      LOCAL_STT_CPU_THREADS: ${LOCAL_STT_CPU_THREADS:-}
      LOCAL_STT_SILENCE_MS: ${LOCAL_STT_SILENCE_MS:-}
      LOCAL_STT_MAX_CHUNK_MS: ${LOCAL_STT_MAX_CHUNK_MS:-}
    # The model is downloaded once (Hugging Face) into this volume; everything else is read-only.
    volumes:
      - stt-models:/models
    networks: [internal, egress]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      # The first start downloads the model (several hundred MB).
      start_period: 300s
    deploy:
      resources:
        limits: { cpus: '4.00', memory: 3G }

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine
    user: '999:1000'
    entrypoint: ['/bin/sh', '/opt/lfc/start.sh']
    volumes:
      - ./deploy/compose/redis/start.sh:/opt/lfc/start.sh:ro
    secrets: [redis_password, redis_mcp_password]
    networks: [internal]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(sed -e ''s/^[[:space:]]*//'' -e ''s/[[:space:]]*$$//'' /run/secrets/redis_password | tr -d ''\r\n'')" redis-cli --no-auth-warning --user app ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }

  searxng:
    <<: *hardening
    image: searxng/searxng:2026.9.23-3cd69d30e
    user: '977:977'
    # The secret key comes from the Compose secret; refuse to start without it.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -s /run/secrets/searxng_secret || { echo 'searxng_secret missing (make secrets-init)' >&2; exit 1; };
        SEARXNG_SECRET="$$(cat /run/secrets/searxng_secret)" exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ./deploy/compose/searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/searxng:size=64m,uid=977,gid=977
    secrets: [searxng_secret]
    # Needs the internet for its upstream search engines; reachable only from the internal network.
    networks: [internal, egress]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 512M }

networks:
  # Caddy only: carries the published host ports (a published network cannot be internal).
  edge: {}
  # Caddy <-> web and gateway. Internal, so the edge-facing services have no internet or host access.
  frontend:
    internal: true
  # Service-to-service traffic; no route to the internet or the host.
  internal:
    internal: true
  # Outbound internet access for services that need it (SearXNG, fact-checker, explainer).
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  stt-models: {}

secrets:
  redis_password:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/redis_password
  redis_mcp_password:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/redis_mcp_password
  searxng_secret:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/searxng_secret
  gateway_token:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/gateway_token
  anthropic_api_key:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/anthropic_api_key
  typesafe_api_key:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/typesafe_api_key
  google_factcheck_api_key:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/google_factcheck_api_key
  deepgram_api_key:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/deepgram_api_key
  assemblyai_api_key:
    file: ${SECRETS_DIR:-${HOME}/.config/live-factcheck/secrets}/assemblyai_api_key
